<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Week 5 - William Zacher</title>
    <meta name="description"
        content="Form building practice and assignment for week 5. This is the form that asks you about your vibes">
    <meta name="author" content="William Zacher">
    <link rel="stylesheet" href="styles/form.css">
    <script defer src="scripts/form.js"></script>
    <script defer src="scripts/getdates.js"></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get">
            <div>

                <label for="product-name">
                    Product Name
                </label>
                <select name="product-name" id="product-name" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select>
            </div>
            <div>
                <p>Overall Rating</p>
                <div id="star-box">
                    <label for="one-star">☆</label>
                    <label for="two-star">☆☆</label>
                    <label for="three-star">☆☆☆</label>
                    <label for="four-star">☆☆☆☆</label>
                    <label for="five-star">☆☆☆☆☆</label>
                    <input type="radio" name="rating" value="one-star" id="one-star" required>
                    <input type="radio" name="rating" value="two-star" id="two-star" required>
                    <input type="radio" name="rating" value="three-star" id="three-star" required>
                    <input type="radio" name="rating" value="four-star" id="four-star" required>
                    <input type="radio" name="rating" value="five-star" id="five-star" required>
                </div>
            </div>
            <div>
                <label for="date-install">Date of Installation </label>
                <input type="date" required id="date-install">
            </div>
            <div id="feature-box">
                <p>Which features did you find useful in the product?</p>
                <label><input type="checkbox" name="Durability" value="useful-features"> Durability</label>
                <label><input type="checkbox" name="Ease of Use" value="useful-features"> Ease of Use</label>
                <label><input type="checkbox" name="Performance" value="useful-features"> Performance</label>
                <label><input type="checkbox" name="Design" value="useful-features"> Design</label>
            </div>
            <div>

                <label for="written-review">Written Review <span class="optional">(Optional)</span>
                </label>
                <textarea id="written-review" name="written-review"></textarea>
            </div>
            <div>
                <label for="name-gift">Your Name <span class="optional">(Optional)</span>
                </label>
                <input type="text" name="name-gift" id="name-gift">
            </div>
            <div>
                <input type="submit" value="Send Review">
            </div>
        </form>
    </main>
    <footer>
        <p>©<span id="current-year"></span> - William Zacher - United States of America</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
