<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Objects</title>
    <link rel="stylesheet" href="">
    <link rel="stylesheet" href="styles/java-objects.css">
    <script defer src="scripts/java-objects.js"></script>
</head>

<body>
    <h1>JavaScript Objects</h1>
    <!-- 
    1. Given the following object literal for a course,

let aCourse = {
  code: "WDD131",
  title: "Dynamic Web Fundamentals",
  credits: 2,
};

add a sections property to the object. Since the course may have more than one section, make this sections an array of at least two (2) items with the following properties:

    section
    enrolled
    instructor
 -->
    <table id="sections">
        <caption id="courseName"></caption>
        <thead>
            <tr>
                <th>Section</th>
                <th>Enrollment</th>
                <th>Instructor</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</body>

</html>
